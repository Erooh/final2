async function hashPw(u,p){
  try{
    const b=new TextEncoder().encode("kb:"+u.toLowerCase()+":"+p);
    const h=await crypto.subtle.digest("SHA-256",b);
    return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,"0")).join("");
  }catch(e){return "p:"+p;}
}

function lsGet(key,fb){try{const r=localStorage.getItem(key);return r===null?fb:JSON.parse(r);}catch(e){return fb;}}

/* ── Տեղային պահոց (IndexedDB) — օգտագործվում է միայն եթե Firebase-ը միացված չէ ── */
const DB_NAME="kinobak_db",STORE="kv";
let _dbP=null;
function openDB(){return new Promise((res,rej)=>{if(!window.indexedDB){rej(new Error("no idb"));return;}const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE);};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const getDB=()=>_dbP||(_dbP=openDB());
async function dbGet(key,fb){try{const d=await getDB();return await new Promise(res=>{const q=d.transaction(STORE).objectStore(STORE).get(key);q.onsuccess=()=>res(q.result===undefined?fb:q.result);q.onerror=()=>res(fb);});}catch(e){return lsGet("idbfb_"+key,fb);}}
async function dbSet(key,v){try{const d=await getDB();return await new Promise(res=>{const t=d.transaction(STORE,"readwrite");t.objectStore(STORE).put(v,key);t.oncomplete=()=>res(true);t.onerror=()=>res(false);t.onabort=()=>res(false);});}catch(e){return lsSet("idbfb_"+key,v);}}

/* ── Տվյալների շերտ: Firestore (ընդհանուր բոլոր սարքերի համար) կամ տեղային ── */
let fdb=null,fstore=null;
try{
  if(FIREBASE_CONFIG.projectId&&window.firebase){
    firebase.initializeApp(FIREBASE_CONFIG);
    fdb=firebase.firestore();
    try{fstore=firebase.storage();}catch(e){}
  }
}catch(e){console.error(e);fdb=null;}
const CLOUD=!!fdb;

const localCache={},localLs={};
async function localLoad(c){if(!localCache[c]){localCache[c]=await dbGet("kb3_"+c,{});localLs[c]=[];}return localCache[c];}
const Store={
  listen(c,cb){
    if(fdb){
      let first=true;
      return fdb.collection(c).onSnapshot(s=>{first=false;const o={};s.forEach(d=>{o[d.id]=d.data();});cb(o);},err=>{console.error(err);if(first){first=false;cb({});}});
    }
    let off=false;
    localLoad(c).then(()=>{if(off)return;localLs[c].push(cb);cb({...localCache[c]});});
    return()=>{off=true;localLs[c]=(localLs[c]||[]).filter(x=>x!==cb);};
  },
  listenDoc(c,id,cb){
    if(fdb)return fdb.collection(c).doc(id).onSnapshot(d=>cb(d.exists?d.data():null),err=>console.error(err));
    return Store.listen(c,o=>cb(o[id]||null));
  },
  async put(c,id,data){
    try{
      if(fdb){await fdb.collection(c).doc(id).set(data);return true;}
      await localLoad(c);localCache[c][id]=data;const ok=await dbSet("kb3_"+c,localCache[c]);
      (localLs[c]||[]).forEach(f=>f({...localCache[c]}));return ok;
    }catch(e){console.error(e);return false;}
  },
  async del(c,id){
    try{
      if(fdb){await fdb.collection(c).doc(id).delete();return true;}
      await localLoad(c);delete localCache[c][id];const ok=await dbSet("kb3_"+c,localCache[c]);
      (localLs[c]||[]).forEach(f=>f({...localCache[c]}));return ok;
    }catch(e){console.error(e);return false;}
  },
};

function compressImage(file,maxW=720,q=.78){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{
      const im=new Image();
      im.onload=()=>{const k=Math.min(1,maxW/im.width);const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q));};
      im.onerror=()=>res(e.target.result);
      im.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

/* VIDEO PLAYER — լրիվ էկրան, ավտոմատ հորիզոնական, շարունակում է պահված կետից */
function VideoPlayer({src,title,startAt=0,onProgress,onClose,C}){
  const wrap=useRef(),vid=useRef();
  const closing=useRef(false),entered=useRef(false),lastSave=useRef(0);
  const propsRef=useRef({});propsRef.current={onProgress,onClose,startAt};
  const[ui,setUi]=useState(true);
  const hideT=useRef();
  const showUi=()=>{setUi(true);clearTimeout(hideT.current);hideT.current=setTimeout(()=>{if(vid.current&&!vid.current.paused)setUi(false);},3000);};
  const save=(ended)=>{
    const v=vid.current;
    if(!v||!v.duration||isNaN(v.duration))return;
    propsRef.current.onProgress?.(v.currentTime,v.duration,!!ended);
  };
  const doClose=()=>{
    if(closing.current)return;closing.current=true;
    save(false);
    try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock();}catch(e){}
    try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if(document.webkitFullscreenElement)document.webkitExitFullscreen();}catch(e){}
    propsRef.current.onClose();
  };
  useEffect(()=>{
    document.body.style.overflow="hidden";
    const w=wrap.current,v=vid.current;
    (async()=>{
      try{
        if(w.requestFullscreen)await w.requestFullscreen();
        else if(w.webkitRequestFullscreen)w.webkitRequestFullscreen();
      }catch(e){}
      try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock("landscape");}catch(e){}
    })();
    const onFs=()=>{
      const fs=document.fullscreenElement||document.webkitFullscreenElement;
      if(fs){entered.current=true;}
      else if(entered.current){doClose();}
    };
    const onHide=()=>{if(document.visibilityState==="hidden")save(false);};
    const onEndFs=()=>doClose();
    document.addEventListener("fullscreenchange",onFs);
    document.addEventListener("webkitfullscreenchange",onFs);
    document.addEventListener("visibilitychange",onHide);
    window.addEventListener("pagehide",onHide);
    v.addEventListener("webkitendfullscreen",onEndFs);
    showUi();
    return()=>{
      document.body.style.overflow="";
      document.removeEventListener("fullscreenchange",onFs);
      document.removeEventListener("webkitfullscreenchange",onFs);
      document.removeEventListener("visibilitychange",onHide);
      window.removeEventListener("pagehide",onHide);
      v.removeEventListener("webkitendfullscreen",onEndFs);
      clearTimeout(hideT.current);
      try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock();}catch(e){}
    };
  },[]);
  const onMeta=()=>{
    const v=vid.current;
    const s=propsRef.current.startAt;
    if(s>0&&v.duration&&s<v.duration-5)v.currentTime=s;
    const p=v.play();if(p&&p.catch)p.catch(()=>{setUi(true);});
    const w=wrap.current;
    if(!w.requestFullscreen&&!w.webkitRequestFullscreen&&v.webkitEnterFullscreen){try{v.webkitEnterFullscreen();}catch(e){}}
  };
  const onTime=()=>{
    const now=Date.now();
    if(now-lastSave.current>5000){lastSave.current=now;save(false);}
  };
  return(
    <div ref={wrap} onMouseMove={showUi} onTouchStart={showUi} style={{position:"fixed",inset:0,zIndex:950,background:"#000",display:"flex",flexDirection:"column"}}>
      <video ref={vid} src={src} controls playsInline preload="auto"
        onLoadedMetadata={onMeta} onTimeUpdate={onTime}
        onPause={()=>{setUi(true);save(false);}} onPlay={showUi}
        onEnded={()=>{save(true);setUi(true);}}
        style={{width:"100%",height:"100%",objectFit:"contain",display:"block",background:"#000"}}/>
      <div style={{position:"absolute",top:0,left:0,right:0,padding:"14px 18px",display:"flex",alignItems:"center",gap:12,background:"linear-gradient(to bottom,rgba(0,0,0,.85) 0%,transparent 100%)",zIndex:2,opacity:ui?1:0,pointerEvents:ui?"auto":"none",transition:"opacity .3s"}}>
        <button className="bp" onClick={doClose}
          style={{background:"rgba(20,20,30,.85)",backdropFilter:"blur(14px)",border:"1px solid rgba(255,255,255,.2)",borderRadius:10,padding:"10px 18px",cursor:"pointer",display:"flex",gap:8,alignItems:"center",flexShrink:0}}>
          <Ic n="back" size={16} color="#fff"/>
          <span style={{color:"#fff",fontSize:13,fontWeight:600}}>Դուրս գալ</span>
        </button>
        {title&&<div style={{color:"rgba(255,255,255,.75)",fontSize:16,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontFamily:"'Cormorant Garamond',serif"}}>{title}</div>}
      </div>
    </div>
  );
}

      if(!fstore){setUpErr("Firebase Storage-ը միացված չէ. օգտագործեք վիդեոյի հղումը (URL)");return;}
      setUp(0);
      const ref=fstore.ref(`videos/${uid()}_${f.name.replace(/[^\w.\-]/g,"_")}`);
      const task=ref.put(f);
      task.on("state_changed",
        s=>setUp(Math.round(s.bytesTransferred/s.totalBytes*100)),
        err=>{console.error(err);setUp(null);setUpErr("Վիդեոն չբեռնվեց. ստուգեք Firebase Storage-ի կանոնները կամ օգտագործեք URL");},
        async()=>{const url=await task.snapshot.ref.getDownloadURL();setForm(fm=>({...fm,videoUrl:url,videoName:f.name}));setUp(null);}
      );
    }else{
      const r=new FileReader();

          <div style={{position:"relative",zIndex:1,animation:bounce===t.id?"bounce .42s cubic-bezier(.34,1.56,.64,1)":"none",transform:on?"scale(1.1)":"scale(1)",transition:"transform .2s"}}><Ic n={ic} size={23} color={on?C.gold:C.muted}/></div>

/* ROOT APP */
function App(){
  const[isDark,setIsDark]=useState(()=>lsGet("kb_theme_v3",true)!==false);
  const C=isDark?D:L;
  useEffect(()=>{
    let st=document.getElementById("kb-style");
    if(!st){st=document.createElement("style");st.id="kb-style";document.head.appendChild(st);}
    st.textContent=G_CSS(C);
    document.body.style.background=C.bg;
    document.body.style.color=C.text;
  });
  useEffect(()=>{lsSet("kb_theme_v3",isDark);},[isDark]);

  const[moviesMap,setMoviesMap]=useState(null);
  const[usersMap,setUsersMap]=useState(null);
  const[ratingsMap,setRatingsMap]=useState({});
  const[commentsMap,setCommentsMap]=useState({});
  const[wlIds,setWlIds]=useState([]);
  const[progMap,setProgMap]=useState({});
  const[curId,setCurId]=useState(()=>lsGet("kb_sid_v3",null));
  const[forceReady,setForceReady]=useState(false);
  const[saveErr,setSaveErr]=useState(false);

  /* Ամբողջ տվյալների կենդանի բաժանորդագրություն (բոլոր սարքերում նույնն է) */
  useEffect(()=>{
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
    const offs=[
      Store.listen("movies",setMoviesMap),
      Store.listen("users",setUsersMap),
      Store.listen("ratings",setRatingsMap),
      Store.listen("comments",setCommentsMap),
    ];
    const t=setTimeout(()=>setForceReady(true),7000);
    return()=>{offs.forEach(f=>f&&f());clearTimeout(t);};
  },[]);
  useEffect(()=>{
    setWlIds([]);setProgMap({});
    if(!curId)return;
    const a=Store.listenDoc("watchlist",curId,d=>setWlIds((d&&d.ids)||[]));
    const b=Store.listenDoc("progress",curId,d=>setProgMap((d&&d.map)||{}));
    return()=>{a&&a();b&&b();};
  },[curId]);

  /* Ադմինի հաշիվը ստեղծվում է առաջին անգամ */
  const seeded=useRef(false);
  useEffect(()=>{
    if(!usersMap||seeded.current)return;
    seeded.current=true;
    if(!usersMap["u_admin"]){
      hashPw("admin","admin123").then(h=>Store.put("users","u_admin",{id:"u_admin",username:"admin",pass:h,isAdmin:true}));
    }
  },[usersMap]);

  const ready=(moviesMap!==null&&usersMap!==null)||forceReady;
  const movies=Object.values(moviesMap||{}).filter(m=>!OLD_SEED_IDS.includes(m.id));
  const users=usersMap||{};
  const curUser=curId&&users[curId]?users[curId]:null;
  const allRatings={};Object.keys(ratingsMap).forEach(k=>{allRatings[k]=ratingsMap[k].list||[];});
  const allComments={};Object.keys(commentsMap).forEach(k=>{allComments[k]=commentsMap[k].list||[];});
  const watchlist=new Set(wlIds);
  const cont=Object.entries(progMap).map(([id,p])=>({movie:movies.find(m=>m.id===id),p})).filter(x=>x.movie&&x.p&&x.p.t>5).sort((a,b)=>(b.p.at||0)-(a.p.at||0));

  const save=async pr=>{const ok=await pr;setSaveErr(ok===false);return ok;};

  const[view,setView]=useState("home");
  const[selId,setSelId]=useState(null);
  const[editMovie,setEditMovie]=useState(null);
  const[authError,setAuthError]=useState("");
  const selMovie=movies.find(m=>m.id===selId)||null;

  const handleLogin=async(u,p)=>{
    const h=await hashPw(u,p);
    const f=Object.values(users).find(x=>x.username===u&&x.pass===h);
    if(f){setCurId(f.id);lsSet("kb_sid_v3",f.id);setAuthError("");setView("home");}
    else setAuthError("Օգտանունը կամ գաղտնաբառը սխալ է");
  };
  const handleRegister=async(u,p)=>{
    if(u.toLowerCase()==="admin"||Object.values(users).find(x=>x.username.toLowerCase()===u.toLowerCase())){setAuthError("Օգտանունը զբաղված է");return;}
    const nu={id:uid(),username:u,pass:await hashPw(u,p),isAdmin:false};
    await save(Store.put("users",nu.id,nu));
    setCurId(nu.id);lsSet("kb_sid_v3",nu.id);setAuthError("");setView("home");
  };
  const handleLogout=()=>{setCurId(null);lsSet("kb_sid_v3",null);setView("home");};
  const handleRate=(mid,stars)=>{if(!curUser)return;const list=[...(allRatings[mid]||[]).filter(r=>r.userId!==curUser.id),{userId:curUser.id,stars}];save(Store.put("ratings",mid,{list}));};
  const handleComment=(mid,text)=>{if(!curUser)return;const list=[...(allComments[mid]||[]),{id:uid(),userId:curUser.id,userName:curUser.username,text,createdAt:Date.now()}];save(Store.put("comments",mid,{list}));};
  const handleWatchlist=id=>{
    if(!curUser){setView("auth");return;}
    const n=wlIds.includes(id)?wlIds.filter(x=>x!==id):[...wlIds,id];
    setWlIds(n);save(Store.put("watchlist",curUser.id,{ids:n}));
  };
  const progRef=useRef({});progRef.current=progMap;
  const handleProgress=(mid,t,d,ended)=>{
    if(!curUser)return;
    const map={...progRef.current};
    if(ended||t>d-15||t<5)delete map[mid];
    else map[mid]={t:Math.floor(t),d:Math.floor(d),at:Date.now()};
    progRef.current=map;setProgMap(map);
    save(Store.put("progress",curUser.id,{map}));
  };
  const handleAddMovie=m=>save(Store.put("movies",m.id,m));
  const handleDeleteMovie=id=>{save(Store.del("movies",id));if(selId===id){setSelId(null);setView("home");}setEditMovie(null);};
  const handleSaveEdit=upd=>{save(Store.put("movies",upd.id,{...(moviesMap[upd.id]||{}),...upd}));setEditMovie(null);};
  const openEdit=m=>{if(!curUser?.isAdmin){setView("auth");return;}setEditMovie(m);};
  const openDetail=m=>{setSelId(m.id);setView("detail");};
  const isAdmin=curUser?.isAdmin;
  const hideAll=view==="auth";
  const hideNav=view==="auth"||view==="detail";
  const navChange=v=>{if(v==="admin"&&!isAdmin){setView("auth");return;}setView(v);};
  const cp={movies,allRatings,watchlist,onWatchlist:handleWatchlist,onEdit:isAdmin?openEdit:null,onSelect:openDetail,goAdmin:()=>setView("admin"),cont,C};

  if(!ready)return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center"}}><Logo h={46} C={C}/></div>
  );

  return(
    <div style={{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:"'Jost',sans-serif",maxWidth:680,margin:"0 auto",position:"relative",overflowX:"hidden",transition:"background .35s,color .35s"}}>
      {saveErr&&<div style={{position:"fixed",top:0,left:0,right:0,zIndex:999,background:C.red,color:"#fff",fontSize:12,fontWeight:600,textAlign:"center",padding:"8px 12px"}}>⚠ Տվյալները չեն պահպանվում. ստուգեք կապը կամ Firebase-ի կանոնները</div>}
      {!CLOUD&&isAdmin&&<div style={{background:C.goldL,borderBottom:`1px solid ${C.gold}44`,color:C.gold,fontSize:12,fontWeight:600,textAlign:"center",padding:"8px 12px",lineHeight:1.5}}>Տեղային ռեժիմ. Firebase-ը միացված չէ, ֆիլմերը այլ սարքերում չեն երևա (լրացրեք FIREBASE_CONFIG-ը)</div>}
      {!hideAll&&<Header curUser={curUser} onProfileClick={()=>setView(curUser?"profile":"auth")} isDark={isDark} onToggleTheme={()=>setIsDark(d=>!d)} C={C}/>}
      {view==="home"     &&<PageHome      {...cp}/>}
      {view==="movies"   &&<PageMovies    {...cp}/>}
      {view==="watchlist"&&<PageWatchlist {...cp}/>}
      {view==="admin"    &&isAdmin&&<PageAdmin movies={movies} onAdd={handleAddMovie} onDelete={handleDeleteMovie} onEdit={openEdit} C={C}/>}
      {view==="profile"  &&<PageProfile curUser={curUser} allRatings={allRatings} allComments={allComments} watchlist={watchlist} cont={cont} onSelect={openDetail} onLogout={handleLogout} setView={setView} C={C}/>}
      {view==="auth"     &&<PageAuth onLogin={handleLogin} onRegister={handleRegister} onBack={()=>setView("home")} error={authError} C={C}/>}
      {view==="detail"   &&selMovie&&<PageDetail movie={selMovie} curUser={curUser} allRatings={allRatings} allComments={allComments} watchlist={watchlist} prog={progMap[selMovie.id]} onRate={handleRate} onComment={handleComment} onWatchlist={handleWatchlist} onProgress={handleProgress} onBack={()=>setView("home")} onDelete={handleDeleteMovie} onEdit={openEdit} C={C}/>}
      {!hideNav&&<BottomNav active={view} isAdmin={isAdmin} onChange={navChange} C={C}/>}
      {editMovie&&<EditModal movie={editMovie} onSave={handleSaveEdit} onClose={()=>setEditMovie(null)} C={C}/>}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
  </script>
</body>
</html>
